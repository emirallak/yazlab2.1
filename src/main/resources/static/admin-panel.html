<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haber Botu Kontrol Paneli</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background-color: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      text-align: center;
      width: 400px;
    }
    h1 {
      color: #2c3e50;
      font-size: 24px;
      margin-bottom: 20px;
    }
    button {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.1s;
      width: 100%;
      margin-bottom: 10px;
    }
    button:hover {
      background-color: #c0392b;
    }
    button:active {
      transform: scale(0.98);
    }
    button:disabled {
      background-color: #95a5a6;
      cursor: not-allowed;
    }
    /* ADIM 1 - Kırmızı */
    #tetikleBtn {
      background-color: #e74c3c;
    }
    #tetikleBtn:hover {
      background-color: #c0392b;
    }
    /* ADIM 2 - Mor */
    .process-btn {
      background-color: #9b59b6;
    }
    .process-btn:hover {
      background-color: #8e44ad;
    }
    /* ADIM 3 - Mavi */
    .map-btn {
      background-color: #3498db;
    }
    .map-btn:hover {
      background-color: #2980b9;
    }
    h3 {
      font-size: 14px;
      margin-bottom: 12px;
      padding-left: 10px;
      border-left: 4px solid #2196F3;
    }
    #durum {
      margin-top: 20px;
      font-size: 14px;
      font-weight: bold;
      padding: 15px;
      border-radius: 6px;
      display: none; /* Başlangıçta gizli */
    }
    .loading {
      background-color: #f39c12;
      color: white;
    }
    .success {
      background-color: #27ae60;
      color: white;
    }
    .error {
      background-color: #c0392b;
      color: white;
    }
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid white;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 10px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🤖 Haber Botu Yönetimi</h1>
  <p style="color: #7f8c8d; margin-bottom: 30px;">🌍 OpenStreetMap + Nominatim (Ücretsiz Geocoding)</p>

  <h3 style="color: #2c3e50; margin-bottom: 15px; text-align: left;">📋 ADIM 1: Haberleri Topla (En Spesifik Konum Seçilir)</h3>
  <button id="tetikleBtn">Botları Ateşle 🔥</button>

  <h3 style="color: #2c3e50; margin-top: 20px; margin-bottom: 15px; text-align: left;">📍 ADIM 2: Konumları İşle</h3>
  <button class="process-btn" onclick="processLocations()">Konumları İşle 📍</button>

  <h3 style="color: #2c3e50; margin-top: 20px; margin-bottom: 15px; text-align: left;">🗺️ ADIM 3: Haritayı Aç</h3>
  <button class="map-btn" onclick="openMap()">Haritayı Aç 🗺️</button>

  <div id="durum"></div>
</div>

<script>
  const tetikleBtn = document.getElementById('tetikleBtn');
  const durumDiv = document.getElementById('durum');

  // Haritayı aç
  function openMap() {
    window.open('http://localhost:8080/map', '_blank', 'width=1200,height=800');
  }

  // Konumları işle
  function processLocations() {
    tetikleBtn.disabled = true;

    durumDiv.className = 'loading';
    durumDiv.innerHTML = '<div class="loader"></div> Tüm haberlerin konumları işleniyor...';
    durumDiv.style.display = 'block';

    fetch('http://localhost:8080/api/scrape/all-locations', {
      method: 'POST'
    })
      .then(response => {
        if (!response.ok) {
          throw new Error('Sunucu hatası oluştu!');
        }
        return response.text();
      })
      .then(data => {
        durumDiv.className = 'success';
        durumDiv.innerHTML = '✅ Tüm haberlerin konumları işlendi! Haritada görmek için "Haritayı Aç" butonuna tıkla.';
      })
      .catch(error => {
        durumDiv.className = 'error';
        durumDiv.innerHTML = '❌ Bir hata oluştu: ' + error.message;
      })
      .finally(() => {
        tetikleBtn.disabled = false;
      });
  }

  tetikleBtn.addEventListener('click', () => {
    // Butonu kilitle ve yükleniyor animasyonu göster
    tetikleBtn.disabled = true;
    tetikleBtn.innerText = "İşlem Sürüyor...";

    durumDiv.className = 'loading';
    durumDiv.innerHTML = '<div class="loader"></div> Siteler sırayla taranıyor, Chrome açılıp kapanabilir. Lütfen bekleyin...';
    durumDiv.style.display = 'block';

    // Spring Boot Backend'ine POST isteği atıyoruz
    // Not: Spring Boot'un localhost:8080 portunda çalıştığından emin ol.
    fetch('http://localhost:8080/api/haberler/scrape-tetikle', {
      method: 'POST'
    })
            .then(response => {
              if (!response.ok) {
                throw new Error('Sunucu hatası oluştu!');
              }
              return response.text();
            })
            .then(data => {
              // İşlem başarılı!
              durumDiv.className = 'success';
              durumDiv.innerHTML = '✅ İşlem Başarılı! Tüm haberler veritabanına kaydedildi.';
            })
            .catch(error => {
              // İşlem başarısız!
              durumDiv.className = 'error';
              durumDiv.innerHTML = '❌ Bir hata oluştu: ' + error.message;
            })
            .finally(() => {
              // Butonu eski haline getir
              tetikleBtn.disabled = false;
              tetikleBtn.innerText = "Botları Ateşle 🔥";
            });
  });
</script>

</body>
</html>
